name: Voltra Companion
on:
  push:
    branches: [main]
    paths: ['browser-addon/**', 'web/src/notificationEvents.ts', 'web/public/brand/**', '.github/workflows/companion.yml']
  pull_request:
    paths: ['browser-addon/**', 'web/src/notificationEvents.ts', 'web/public/brand/**', '.github/workflows/companion.yml']
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            browser-addon/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - run: npm ci --prefix browser-addon --ignore-scripts
      - run: npm test --prefix browser-addon
      - run: node browser-addon/build.mjs
      - run: npm run lint:firefox --prefix browser-addon
      - run: python browser-addon/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-browser-packages
          path: |
            browser-addon/voltra-companion-*.zip
            browser-addon/SHA256SUMS.txt
          if-no-files-found: error
