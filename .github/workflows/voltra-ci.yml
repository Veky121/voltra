name: Voltra CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: voltra_test
          POSTGRES_PASSWORD: voltra-ci-only
          POSTGRES_DB: voltra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voltra_test -d voltra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://voltra_test:voltra-ci-only@127.0.0.1:5432/voltra_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: node --experimental-strip-types --test web/tests/*.test.mjs web/tests/*.test.cjs
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - run: bash tools/ci/test-linux.sh ./...
      - run: go build ./cmd/panel ./cmd/node
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: go -C desktop test ./...
      - shell: pwsh
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ci-unsigned
          path: desktop/bin/*.exe
          retention-days: 7
